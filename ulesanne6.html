<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Ülesanne 6</title>
</head>
<body>
  <h1>Positiivne või negatiivne arv</h1>

  <script>
   let arv = Number(prompt("Sisesta arv:"));
switch (true) {
    case arv > 0:
    console.log("Sisestatud arv on positiivne.");
    break;
    case arv < 0:
    console.log("Sisestatud arv on negatiivne.");
    break;
    case arv === 0:
    console.log("Sisestatud arv on null.");
    break;

}
  </script>
</body>
</html>
